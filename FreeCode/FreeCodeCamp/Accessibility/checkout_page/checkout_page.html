<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Checkout Page</title>
</head>

<body>
<h1>Checkout</h1>
        <section>
            <h2>Your Cart</h2>
            <img src="https://cdn.freecodecamp.org/curriculum/labs/cube.jpg$0" alt="alternate text about this link test"/>
        </section>
        <section>
            <h2>Payment Information</h2>
            <form>

            </form>
        </section>
