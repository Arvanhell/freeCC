<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="container">
<form>
<label for="name">Name: </label>
<input type="text" id="name" name="name" placeholder="eg. Jane Doe" required>
<label for="email">Email: </label>
<input type="email" id="email" name="email" placeholder="eg. jane_doe@ex.org" required />
<select id="position">
<option>Clerk</option>
<option>Supervisor</option>
<option>Manager</option>
</select>
<fieldset class="radio-group">
  <legend>Availability</legend> <input type="radio" id="full-time" name="availability" value="full-time">
  <label for="full-time">Full-time</label>
  
  <input type="radio" id="part-time" name="availability" value="part-time">
  <label for="part-time">Part-time</label>
</fieldset>

<textarea id="message">
</textarea>
<button type="submit">Send</button>
</form>
</div>
</body>
</html>
